%YAML:1.0
---
# 串口连接参数（Serial 类用 cv::FileStorage 读）
# 帧格式固定在代码里：帧头 0x5A + 3×float32(小端) = yaw/pitch/roll，无 CRC，不走配置
device: "/dev/ttyTHS1"     # Jetson 串口设备节点
baudrate: 115200           # 波特率，需与 STM32 一致
data_bits: 8               # 数据位：5 / 6 / 7 / 8
parity: "none"             # 校验位：none / even / odd
stop_bits: 1               # 停止位：1 / 2
flow_control: "none"       # 流控：none / hardware(RTS/CTS)
